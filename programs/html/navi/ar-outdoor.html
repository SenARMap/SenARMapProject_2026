<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>屋外ルート網AR | IKU NAVI</title>

  <!-- A-Frame + AR.js (ロケーションベースAR) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #btn-back {
      flex-shrink: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    #hud-status { flex: 1; min-width: 0; }
    #gps-status {
      font-size: 13px; font-weight: 600; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #gps-raw      { font-size: 11px; color: #CBD5E1; margin-top: 2px; }
    #graph-status { font-size: 11px; color: #CBD5E1; margin-top: 2px; }

    #debug-log {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
      max-height: 38vh; overflow-y: auto;
      padding: 8px 10px;
      background: rgba(0,0,0,0.72);
      color: #E2E8F0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-all;
    }
    #debug-log .err  { color: #FCA5A5; }
    #debug-log .ok   { color: #86EFAC; }
    #debug-log .warn { color: #FDE68A; }

    #start-overlay {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding: 24px; text-align: center;
      background: rgba(15, 23, 42, 0.92);
      color: white;
    }
    #start-overlay h1 { font-size: 20px; font-weight: 800; }
    #start-overlay p  { font-size: 13px; color: #CBD5E1; line-height: 1.8; }
    #btn-start {
      margin-top: 8px;
      height: 48px; padding: 0 36px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8);
      color: white; font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- 開始オーバーレイ（iOSのセンサー許可はユーザー操作起点が必須） -->
<div id="start-overlay">
  <h1>屋外ルート網AR</h1>
  <p>
    カメラ・位置情報・モーションセンサーの<br>
    アクセスを許可してください。<br><br>
    登録済みの屋外ノードとそれを繋ぐ経路が<br>
    実際の風景に重なって表示されます。
  </p>
  <button id="btn-start">ARを開始</button>
</div>

<!-- HUD -->
<div id="hud">
  <a id="btn-back" href="index.html" aria-label="ナビに戻る">←</a>
  <div id="hud-status">
    <div id="gps-status">AR位置: 反映待ち...</div>
    <div id="gps-raw">端末GPS: 受信待ち...</div>
    <div id="graph-status">データ読み込み中...</div>
  </div>
</div>

<!-- デバッグログ（端末上で実行状況を可視化）。?debug=0 で非表示 -->
<div id="debug-log"></div>

<!-- ARシーン -->
<a-scene
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
  renderer="antialias: true; alpha: true">
  <a-camera id="ar-camera" gps-new-camera="gpsMinDistance: 3"></a-camera>
</a-scene>

<script>
// ================================================================
// 端末上デバッグログ — iPhone Chrome等でDevToolsが使えない環境向け。
// 画面下部に実行状況を時刻付きで表示する。?debug=0 で無効化。
// ================================================================
const DEBUG_ON = new URLSearchParams(location.search).get("debug") !== "0";
function dlog(msg, cls) {
  if (!DEBUG_ON) return;
  const box = document.getElementById("debug-log");
  if (!box) return;
  const t = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `${t}  ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
if (!DEBUG_ON) {
  const box = document.getElementById("debug-log");
  if (box) box.style.display = "none";
}
// 実行時エラーを拾ってログに出す（iOSで何か throw していないか確認用）
window.addEventListener("error", (e) => {
  dlog(`JSエラー: ${e.message} @${(e.filename||"").split("/").pop()}:${e.lineno}`, "err");
});
window.addEventListener("unhandledrejection", (e) => {
  dlog(`Promiseエラー: ${e.reason && (e.reason.message || e.reason)}`, "err");
});
dlog("スクリプト開始", "ok");

// シーンとカメラコンポーネントのライフサイクルを記録
document.querySelector("a-scene").addEventListener("loaded", () => dlog("a-scene loaded", "ok"));
document.getElementById("ar-camera").addEventListener("componentinitialized", (e) => {
  if (e.detail.name === "gps-new-camera") dlog("gps-new-camera 初期化完了", "ok");
});

// ================================================================
// テキストを常にカメラへ向けるビルボードコンポーネント
// ================================================================
AFRAME.registerComponent("face-camera", {
  tick: function () {
    const cam = document.getElementById("ar-camera");
    if (cam) this.el.object3D.lookAt(cam.object3D.position);
  },
});

// ================================================================
// 設定
// ================================================================
const API_BASE     = "";
const NODE_COLOR   = "#22D3EE";  // ノード球の色
const EDGE_COLOR   = "#3B82F6";  // 接続線の色
const PATH_Y       = 0.3;        // 線・球の高さ（カメラ基準。カメラ≒目線1.6mなので足元寄り）
const EDGE_RADIUS  = 0.12;       // 接続線（円柱）の太さ
const NODE_RADIUS  = 0.45;       // ノード球の半径

// ================================================================
// 座標変換 — AR.js内部と同じ球面メルカトル(EPSG:3857)で
// 基準点からの相対オフセット(m)を計算する。
// AR.jsのワールド座標は x=東(+), z=北(-) なので z は反転する。
// ================================================================
const EARTH_R = 6378137;
function mercator(lat, lng) {
  return {
    x: EARTH_R * lng * Math.PI / 180,
    y: EARTH_R * Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2)),
  };
}

// ================================================================
// State
// ================================================================
const scene = document.querySelector("a-scene");
const camEl = document.getElementById("ar-camera");
let outdoorNodes = [];   // [{id, lat, lng, x, z}, ...] x/z は基準点からの相対座標
let curPos = null;
let arjsFixCount = 0;    // AR.jsに反映されたGPS更新の回数
let rawFixCount  = 0;    // 端末から受信した生GPSフィックスの回数

// ================================================================
// GPS駆動方式について
// ----------------------------------------------------------------
// AR.js の gps-new-camera は内部で自前の watchPosition を回すが、
// 端末によってはその watch が一度もコールバックを返さず、結果として
// gps-camera-update-position が永遠に発火しない（=「AR位置: 反映待ち」
// のまま）症状が出る。
//
// そこで本ページでは AR.js 内部のGPS監視に頼らず、こちら側で
// watchPosition を1本だけ回し、各フィックスを simulateLatitude/
// simulateLongitude 経由で AR.js に注入する。
// この属性をセットすると AR.js は内部の watch を stopGps() で止め、
// fakeGps() で座標を直接流し込む（精度ゲートも通らないので確実に反映）。
// ================================================================
const qs     = new URLSearchParams(location.search);
const fixLat = parseFloat(qs.get("lat"));   // ?lat&lng で固定座標シミュレート（屋内/PC確認用）
const fixLng = parseFloat(qs.get("lng"));
const SIMULATED = !Number.isNaN(fixLat) && !Number.isNaN(fixLng);

const GPS_ERR_MSG = {
  1: "位置情報の許可が拒否されています（ブラウザ設定を確認）",
  2: "位置を取得できません（屋内・GPS無効の可能性）",
  3: "取得タイムアウト",
};

// gps-new-camera コンポーネントの初期化完了を待ってから座標を注入する
let _waitLogged = false;
function whenCameraReady(cb) {
  if (camEl.components && camEl.components["gps-new-camera"]) { cb(); return; }
  if (!_waitLogged) { dlog("gps-new-camera 初期化待ち...", "warn"); _waitLogged = true; }
  camEl.addEventListener("componentinitialized", function onInit(e) {
    if (e.detail.name === "gps-new-camera") {
      camEl.removeEventListener("componentinitialized", onInit);
      cb();
    }
  });
}

// 監視: 注入したのに一定時間 gps-camera-update-position が来なければ警告
setTimeout(() => {
  if (_pushCount > 0 && arjsFixCount === 0) {
    dlog(`注意: ${_pushCount}回注入したが gps-camera-update-position が未発火。`, "err");
    dlog("→ fakeGps/emit がこの端末で機能していない可能性。", "err");
  } else if (_pushCount === 0) {
    dlog("注意: 一度も注入されていない（GPS/シミュレート未起動）。", "err");
  }
}, 8000);

// AR.js に1フィックス注入する（simulate属性 → 内部で fakeGps が走る）
let _pushCount = 0;
function pushPositionToArjs(lat, lng) {
  whenCameraReady(() => {
    _pushCount++;
    dlog(`AR.jsへ注入 #${_pushCount}: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    try {
      camEl.setAttribute("gps-new-camera", {
        simulateLatitude:  lat,
        simulateLongitude: lng,
      });
    } catch (err) {
      dlog(`setAttribute失敗: ${err.message}`, "err");
    }
  });
}

if (SIMULATED) {
  document.getElementById("gps-raw").textContent =
    `端末GPS: シミュレート中 (${fixLat}, ${fixLng})`;
  // シミュレートは初回反映後に simulate値が0へ戻されるため、
  // 動作確認用に数回流して確実に反映させる
  let n = 0;
  const t = setInterval(() => {
    pushPositionToArjs(fixLat, fixLng);
    if (++n >= 3) clearInterval(t);
  }, 600);
} else if (!navigator.geolocation) {
  document.getElementById("gps-raw").textContent = "端末GPS: この環境では使えません";
} else {
  navigator.geolocation.watchPosition(
    (pos) => {
      rawFixCount++;
      const { latitude, longitude, accuracy } = pos.coords;
      const el = document.getElementById("gps-raw");
      const note = accuracy > 30 ? " ⚠ 精度低下中" : "";
      el.textContent = `端末GPS: ±${Math.round(accuracy)}m / ${rawFixCount}回受信${note}`;
      el.style.color = accuracy > 50 ? "#FCA5A5" : accuracy > 30 ? "#FDE68A" : "#A7F3D0";
      // 受信した位置をそのまま AR.js へ注入（精度に関わらず反映する）
      pushPositionToArjs(latitude, longitude);
    },
    (err) => {
      const el = document.getElementById("gps-raw");
      el.textContent = `端末GPSエラー: ${GPS_ERR_MSG[err.code] || err.message}`;
      el.style.color = "#FCA5A5";
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 27000 }
  );
}

// ================================================================
// 開始ボタン
// ================================================================
document.getElementById("btn-start").addEventListener("click", async () => {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) {
    console.warn("センサー許可の取得に失敗:", e);
  }
  document.getElementById("start-overlay").style.display = "none";
});

// ================================================================
// GPS更新 — HUDに現在地と最寄りノードまでの距離を表示
// ================================================================
camEl.addEventListener("gps-camera-update-position", (e) => {
  curPos = e.detail.position;
  arjsFixCount++;
  if (arjsFixCount === 1) dlog("gps-camera-update-position 初回発火 ✓", "ok");
  let text = `AR位置: ${curPos.latitude.toFixed(5)}, ${curPos.longitude.toFixed(5)} (${arjsFixCount}回反映)`;
  const nearest = findNearestNode(curPos.latitude, curPos.longitude);
  if (nearest) text += `｜最寄りノード ${Math.round(nearest.dist)}m`;
  document.getElementById("gps-status").textContent = text;
});

function findNearestNode(lat, lng) {
  let best = null;
  outdoorNodes.forEach((n) => {
    const d = haversine(lat, lng, n.lat, n.lng);
    if (!best || d < best.dist) best = { node: n, dist: d };
  });
  return best;
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const s  = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

// ================================================================
// グラフ取得 → AR配置
// /api/graph から building=0 かつ lat/lng を持つノードと、
// 両端がその屋外ノードであるエッジだけを使う。
// ================================================================
async function loadOutdoorGraph() {
  const statusEl = document.getElementById("graph-status");
  let data;
  try {
    const res = await fetch(`${API_BASE}/api/graph`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch {
    statusEl.textContent = "APIに接続できません（app.py / nginx を確認）";
    return;
  }

  const nodes = (data.nodes || []).filter(
    (n) => n.building === 0 && n.lat != null && n.lng != null
  );
  if (!nodes.length) {
    statusEl.textContent = "屋外ノードが登録されていません";
    return;
  }
  const byId = {};
  nodes.forEach((n) => { byId[n.id] = n; });

  // 両端が屋外ノードのエッジのみ（建物接続のアンカーエッジ等は除外）。重複は無向で排除
  const seen  = new Set();
  const edges = (data.edges || []).filter((e) => {
    if (!byId[e.from] || !byId[e.to]) return false;
    const key = e.from < e.to ? `${e.from}_${e.to}` : `${e.to}_${e.from}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  buildArGraph(nodes, edges, byId);
  statusEl.textContent = `屋外ノード ${nodes.length}個 / 接続 ${edges.length}本 を表示中`;
}

// ================================================================
// AR配置 — 基準点(最初のノード)だけをGPSアンカーにして、
// 残りは基準点からの相対座標で子要素として置く。
// 全点を個別にGPS配置するより、線と点のズレが原理的に出ない。
// ================================================================
function buildArGraph(nodes, edges, byId) {
  const origin  = nodes[0];
  const originM = mercator(origin.lat, origin.lng);

  // 各ノードの相対座標を計算して保持
  outdoorNodes = nodes.map((n) => {
    const m = mercator(n.lat, n.lng);
    return {
      id:  n.id,
      lat: n.lat,
      lng: n.lng,
      x:  m.x - originM.x,        // 東が +x
      z: -(m.y - originM.y),      // 北が -z
    };
  });
  const relById = {};
  outdoorNodes.forEach((n) => { relById[n.id] = n; });

  // GPSアンカー（このエンティティ以下が現実の座標に固定される）
  const anchor = document.createElement("a-entity");
  anchor.setAttribute(
    "gps-new-entity-place",
    `latitude: ${origin.lat}; longitude: ${origin.lng}`
  );

  // --- ノード球 + IDラベル ---
  outdoorNodes.forEach((n) => {
    const sphere = document.createElement("a-sphere");
    sphere.setAttribute("radius", NODE_RADIUS);
    sphere.setAttribute("color", NODE_COLOR);
    sphere.setAttribute("position", `${n.x} ${PATH_Y} ${n.z}`);
    anchor.appendChild(sphere);

    // A-Frame標準フォントは日本語非対応のためラベルは英数字
    const label = document.createElement("a-text");
    label.setAttribute("value", `N${n.id % 100000}`);
    label.setAttribute("align", "center");
    label.setAttribute("color", "white");
    label.setAttribute("scale", "5 5 5");
    label.setAttribute("position", `${n.x} ${PATH_Y + 1.6} ${n.z}`);
    label.setAttribute("side", "double");
    label.setAttribute("face-camera", "");
    anchor.appendChild(label);
  });

  // --- 接続線（円柱を2点間に渡す）---
  edges.forEach((e) => {
    const a = relById[e.from];
    const b = relById[e.to];
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const len = Math.sqrt(dx * dx + dz * dz);
    if (len < 0.01) return;

    const cyl = document.createElement("a-cylinder");
    cyl.setAttribute("radius", EDGE_RADIUS);
    cyl.setAttribute("height", len);
    cyl.setAttribute("color", EDGE_COLOR);
    cyl.setAttribute("opacity", "0.85");
    cyl.setAttribute(
      "position",
      `${a.x + dx / 2} ${PATH_Y} ${a.z + dz / 2}`
    );
    // 円柱はY軸方向に伸びるので、向きをクォータニオンでXZ平面の進行方向に合わせる
    cyl.addEventListener("loaded", () => {
      const THREE = AFRAME.THREE;
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      cyl.object3D.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), dir
      );
    });
    anchor.appendChild(cyl);
  });

  scene.appendChild(anchor);
}

// 起動時にデータ取得（GPS取得とは独立に走らせる）
loadOutdoorGraph();
</script>
</body>
</html>
