<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>屋外ルート網AR | IKU NAVI</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; 
      overflow: hidden; 
      background: #000; /* カメラ起動前の背景 */
    }

    /* 背景カメラ映像用（最背面） */
    #bg-video {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 0;
    }

    /* 上部HUD */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #btn-back {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: white; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; -webkit-tap-highlight-color: transparent;
    }
    #hud-status { flex: 1; min-width: 0; }
    #gps-status   { font-size: 13px; font-weight: 600; color: white;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #compass-status { font-size: 11px; color: #CBD5E1; margin-top: 2px; }
    #graph-status   { font-size: 11px; color: #CBD5E1; margin-top: 2px; }

    /* 開始オーバーレイ（iOSのセンサー許可はユーザー操作起点が必須） */
    #start-overlay {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding: 24px; text-align: center;
      background: rgba(15, 23, 42, 0.93); color: white;
    }
    #start-overlay h1 { font-size: 20px; font-weight: 800; }
    #start-overlay p  { font-size: 13px; color: #CBD5E1; line-height: 1.8; }
    #start-overlay .perm-note {
      background: rgba(59,130,246,0.18); border: 1px solid rgba(96,165,250,0.5);
      border-radius: 10px; padding: 12px 16px; color: #E2E8F0;
    }
    #start-overlay .perm-note b { color: #93C5FD; }
    #start-overlay .perm-lang { font-size: 11px; color: #94A3B8; }
    #btn-start {
      margin-top: 4px; height: 48px; padding: 0 36px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8);
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    /* デバッグログ（?debug=0 で非表示） */
    #debug-log {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
      max-height: 34vh; overflow-y: auto; padding: 8px 10px;
      background: rgba(0,0,0,0.72); color: #E2E8F0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    }
    #debug-log .err  { color: #FCA5A5; }
    #debug-log .ok   { color: #86EFAC; }
    #debug-log .warn { color: #FDE68A; }
  </style>
</head>
<body>

<video id="bg-video" autoplay playsinline muted></video>

<div id="start-overlay">
  <h1>屋外ルート網AR</h1>
  <p>登録済みの屋外ノードとそれを繋ぐ経路が<br>実際の風景に重なって表示されます。</p>
  <p class="perm-note">
    「開始」を押すと、カメラ・位置情報・モーションの<br>
    許可ダイアログが順に表示されます。<br>
    <b>すべて「許可 / Allow / OK」</b>を選んでください。
  </p>
  <p class="perm-lang">
    ※ 許可ダイアログはiOSが表示するため、文言は<br>
    iPhoneの言語設定に従います（英語表示になる場合があります）。
  </p>
  <button id="btn-start">ARを開始</button>
</div>

<div id="hud">
  <a id="btn-back" href="index.html" aria-label="ナビに戻る">←</a>
  <div id="hud-status">
    <div id="gps-status">現在地: 取得待ち...</div>
    <div id="compass-status">向き: センサー待ち...</div>
    <div id="graph-status">データ読み込み中...</div>
  </div>
</div>

<div id="debug-log"></div>

<a-scene
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; alpha: true"
  style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">

  <a-entity id="ar-camera"
            camera
            position="0 1.6 0"
            compass-camera></a-entity>

  <a-entity id="world"></a-entity>
</a-scene>

<script>
// ================================================================
// URLパラメータ
// ================================================================
const QS       = new URLSearchParams(location.search);
const SIM_LAT  = parseFloat(QS.get("lat"));
const SIM_LNG  = parseFloat(QS.get("lng"));
const SIMULATED = !Number.isNaN(SIM_LAT) && !Number.isNaN(SIM_LNG);
const DEBUG_ON = QS.get("debug") !== "0";

// ================================================================
// デバッグログ
// ================================================================
function dlog(msg, cls) {
  if (!DEBUG_ON) return;
  const box = document.getElementById("debug-log");
  if (!box) return;
  const t = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `${t}  ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
if (!DEBUG_ON) document.getElementById("debug-log").style.display = "none";
window.addEventListener("error", (e) =>
  dlog(`JSエラー: ${e.message} @${(e.filename||"").split("/").pop()}:${e.lineno}`, "err"));
dlog("スクリプト開始", "ok");

// ================================================================
// 向きセンサーの購読
// ================================================================
let gOrient = null;
let _orientAttached = false;
let _orientCount = 0;
function attachOrientation() {
  if (_orientAttached) return;
  _orientAttached = true;
  const onOrient = (e) => {
    gOrient = e;
    _orientCount++;
    if (_orientCount === 1) dlog("deviceorientation 初回受信 ✓", "ok");
  };
  window.addEventListener("deviceorientationabsolute", onOrient);
  window.addEventListener("deviceorientation",        onOrient);
  dlog("向きセンサー購読開始", "ok");
  setTimeout(() => {
    if (_orientCount === 0) dlog("向きイベントが0件。センサー許可を確認。", "err");
  }, 4000);
}

// ================================================================
// 自前の向きコントロール — コンパス絶対方位でカメラのヨーを北基準に固定
// ================================================================
AFRAME.registerComponent("compass-camera", {
  init: function () {
    const THREE = AFRAME.THREE;
    this._zee   = new THREE.Vector3(0, 0, 1);
    this._euler = new THREE.Euler();
    this._q0    = new THREE.Quaternion();
    this._q1    = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90° around X
    this._yawOffset = (parseFloat(QS.get("yaw")) || 0) * Math.PI / 180;
    this._flip      = QS.get("flip") === "1";
    this._logCount  = 0;
    dlog("compass-camera 起動", "ok");
  },

  _screenAngle: function () {
    const a = (screen.orientation && screen.orientation.angle);
    return ((a != null ? a : window.orientation) || 0) * Math.PI / 180;
  },

  tick: function () {
    const e = gOrient;
    if (!e) return;

    let headingDeg;
    if (typeof e.webkitCompassHeading === "number") {
      // webkitCompassHeading: 0=北で時計回り。式のalphaは反時計回りなので変換。
      headingDeg = this._flip ? e.webkitCompassHeading : (360 - e.webkitCompassHeading);
    } else {
      headingDeg = e.alpha || 0;
    }

    // HUDとログに方位を出す（毎フレームは重いので間引き）
    if ((this._logCount++ % 30) === 0) {
      const disp = (typeof e.webkitCompassHeading === "number")
        ? `${Math.round(e.webkitCompassHeading)}°` : `alpha ${Math.round(e.alpha||0)}°`;
      const el = document.getElementById("compass-status");
      if (el) el.textContent = `向き: ${disp}`;
    }

    const alpha  = headingDeg * Math.PI / 180 + this._yawOffset;
    const beta   = (e.beta  || 0) * Math.PI / 180;
    const gamma  = (e.gamma || 0) * Math.PI / 180;
    const orient = this._screenAngle();

    this._euler.set(beta, alpha, -gamma, "YXZ");
    const q = this.el.object3D.quaternion;
    q.setFromEuler(this._euler);
    q.multiply(this._q1);
    q.multiply(this._q0.setFromAxisAngle(this._zee, -orient));
  },
});

// テキストを常にカメラへ向けるビルボード
AFRAME.registerComponent("face-camera", {
  tick: function () {
    const cam = document.getElementById("ar-camera");
    if (cam) this.el.object3D.lookAt(cam.object3D.position);
  },
});

// ================================================================
// 定数・状態
// ================================================================
const API_BASE   = "";
const NODE_COLOR = "#22D3EE";
const EDGE_COLOR = "#3B82F6";
const MARK_Y     = 0;      // マーカーの高さ
const NODE_R     = 0.5;    // ノード球の半径[m]
const EDGE_R     = 0.12;   // 接続線の太さ[m]

const worldEl = document.getElementById("world");
let refLat = null, refLng = null;   // ENUの基準点（最初のノード）
let nodes  = [];                    // [{id, lat, lng}]
let placed = false;

// ================================================================
// ENU換算
// ================================================================
function enuFromRef(lat, lng) {
  const north = (lat - refLat) * 111320;
  const east  = (lng - refLng) * 111320 * Math.cos(refLat * Math.PI / 180);
  return { east, north };
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const s  = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

// ================================================================
// グラフ取得 → マーカー構築
// ================================================================
async function loadOutdoorGraph() {
  const statusEl = document.getElementById("graph-status");
  let data;
  try {
    const res = await fetch(`${API_BASE}/api/graph`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch {
    statusEl.textContent = "APIに接続できません（app.py / nginx を確認）";
    dlog("API取得失敗", "err");
    return;
  }

  const outdoor = (data.nodes || []).filter(
    (n) => n.building === 0 && n.lat != null && n.lng != null
  );
  if (!outdoor.length) {
    statusEl.textContent = "屋外ノードが登録されていません";
    dlog("屋外ノード0件", "err");
    return;
  }
  const byId = {};
  outdoor.forEach((n) => { byId[n.id] = n; });

  const seen = new Set();
  const edges = (data.edges || []).filter((e) => {
    if (!byId[e.from] || !byId[e.to]) return false;
    const key = e.from < e.to ? `${e.from}_${e.to}` : `${e.to}_${e.from}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  nodes  = outdoor.map((n) => ({ id: n.id, lat: n.lat, lng: n.lng }));
  refLat = nodes[0].lat;
  refLng = nodes[0].lng;

  buildMarkers(nodes, edges, byId);
  placed = true;
  statusEl.textContent = `屋外ノード ${nodes.length}個 / 接続 ${edges.length}本`;
  dlog(`マーカー構築: ノード${nodes.length} エッジ${edges.length}`, "ok");

  if (lastUserLat != null) updateWorldPosition(lastUserLat, lastUserLng);
}

function buildMarkers(nodeList, edges, byId) {
  worldEl.innerHTML = "";
  const pos = {}; 

  nodeList.forEach((n) => {
    const { east, north } = enuFromRef(n.lat, n.lng);
    const x = east, z = -north;   
    pos[n.id] = { x, z };

    const sphere = document.createElement("a-sphere");
    sphere.setAttribute("radius", NODE_R);
    sphere.setAttribute("color", NODE_COLOR);
    sphere.setAttribute("position", `${x} ${MARK_Y} ${z}`);
    worldEl.appendChild(sphere);

    const label = document.createElement("a-text");
    label.setAttribute("value", `N${n.id % 100000}`);
    label.setAttribute("align", "center");
    label.setAttribute("color", "white");
    label.setAttribute("scale", "5 5 5");
    label.setAttribute("position", `${x} ${MARK_Y + 1.6} ${z}`);
    label.setAttribute("side", "double");
    label.setAttribute("face-camera", "");
    worldEl.appendChild(label);
  });

  edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.01) return;

    const cyl = document.createElement("a-cylinder");
    cyl.setAttribute("radius", EDGE_R);
    cyl.setAttribute("height", len);
    cyl.setAttribute("color", EDGE_COLOR);
    cyl.setAttribute("opacity", "0.85");
    cyl.setAttribute("position", `${a.x + dx/2} ${MARK_Y} ${a.z + dz/2}`);
    cyl.addEventListener("loaded", () => {
      const THREE = AFRAME.THREE;
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      cyl.object3D.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    });
    worldEl.appendChild(cyl);
  });
}

// ================================================================
// 現在地に合わせて world コンテナを平行移動
// ================================================================
function updateWorldPosition(lat, lng) {
  if (refLat == null) return;
  const { east, north } = enuFromRef(lat, lng);
  worldEl.setAttribute("position", `${-east} 0 ${north}`);
}

// ================================================================
// 現在地（GPS / シミュレート）
// ================================================================
let lastUserLat = null, lastUserLng = null;
let gpsCount = 0;

function onUserPosition(lat, lng, accuracy) {
  lastUserLat = lat; lastUserLng = lng;
  const el = document.getElementById("gps-status");
  const accTxt = accuracy != null ? ` ±${Math.round(accuracy)}m` : "（シミュレート）";
  let text = `現在地: ${lat.toFixed(5)}, ${lng.toFixed(5)}${accTxt}`;
  if (nodes.length) {
    let best = Infinity;
    nodes.forEach((n) => { best = Math.min(best, haversine(lat, lng, n.lat, n.lng)); });
    text += `｜最寄りノード ${Math.round(best)}m`;
  }
  el.textContent = text;
  if (placed) updateWorldPosition(lat, lng);
}

function startPositioning() {
  if (SIMULATED) {
    dlog(`シミュレート現在地: ${SIM_LAT}, ${SIM_LNG}`, "warn");
    onUserPosition(SIM_LAT, SIM_LNG, null);
    return;
  }
  if (!navigator.geolocation) {
    document.getElementById("gps-status").textContent = "現在地: この環境では取得不可";
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      gpsCount++;
      const { latitude, longitude, accuracy } = pos.coords;
      if (gpsCount === 1) dlog(`GPS初回受信 ±${Math.round(accuracy)}m`, "ok");
      onUserPosition(latitude, longitude, accuracy);
    },
    (err) => {
      const msg = { 1: "許可が拒否されています", 2: "取得できません（屋内?）", 3: "タイムアウト" };
      document.getElementById("gps-status").textContent =
        `現在地エラー: ${msg[err.code] || err.message}`;
      dlog(`GPSエラー code=${err.code}`, "err");
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 27000 }
  );
}

// ================================================================
// 開始ボタン — センサー許可＋カメラ起動を取得してから計測開始
// ================================================================
document.getElementById("btn-start").addEventListener("click", function() {
  // ユーザー操作の直後に、await を挟まず許可をリクエストする
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        dlog(`センサー許可: ${permissionState}`, permissionState === "granted" ? "ok" : "err");
        if (permissionState === 'granted') {
          // 重要: カメラ起動(await)より先に、ここで即座に向きセンサーを購読する。
          // await を挟むと iOS ではユーザー操作コンテキストが切れ、
          // その後に張った deviceorientation リスナーにイベントが来ない。
          enableSensorsAndStart();
        } else {
          alert("センサーが拒否されました。設定や履歴を確認してください。");
        }
      })
      .catch(e => {
        dlog(`センサー許可エラー: ${e.message}`, "err");
      });
  } else {
    // AndroidやPCなど、許可ダイアログが不要な環境
    dlog("許可ダイアログ不要環境", "ok");
    enableSensorsAndStart();
  }
});

// 許可が下りた直後の処理。向きセンサー購読を最優先で行う。
function enableSensorsAndStart() {
  attachOrientation();   // ← await より前。最優先で購読
  startPositioning();    // GPS / シミュレート
  startCamera();         // カメラ映像は非同期で後追い（向きとは独立）
  document.getElementById("start-overlay").style.display = "none";
}

// カメラ映像（背景）の起動。向きセンサーとは独立に走らせる。
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    document.getElementById("bg-video").srcObject = stream;
    dlog("カメラ起動 ✓", "ok");
  } catch (err) {
    dlog(`カメラ起動エラー: ${err.message}`, "err");
  }
}

// データ取得
loadOutdoorGraph();
</script>
</body>
</html>
