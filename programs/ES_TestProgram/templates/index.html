<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D最短経路マップ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .form-container { margin-bottom: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; }
        .error { color: red; font-weight: bold; }
        /* グラフコンテナのスタイル */
        .graph-container { width: 100%; height: 80vh; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; background-color: #fff; }
    </style>
</head>
<body>

    <h2>3D最短経路マップ</h2>

    <div class="form-container">
        <form method="POST" action="/">
            <label for="start_node">どこから？:</label>
            <select id="start_node" name="start_node" required>
                <option value="" disabled {% if not start_node %}selected{% endif %}>選択してください</option>
                {% for node in node_list %}
                    <option value="{{ node }}" {% if node == start_node %}selected{% endif %}>{{ node }}</option>
                {% endfor %}
            </select>
            
            <label for="goal_node">どこまで？:</label>
            <select id="goal_node" name="goal_node" required>
                <option value="" disabled {% if not goal_node %}selected{% endif %}>選択してください</option>
                {% for node in node_list %}
                    <option value="{{ node }}" {% if node == goal_node %}selected{% endif %}>{{ node }}</option>
                {% endfor %}
            </select>
            
            <button type="submit">経路を検索</button>
        </form>
        
        {% if error_msg %}
            <p class="error">{{ error_msg }}</p>
        {% endif %}

        {% if path_text %}
            <div style="margin-top: 15px; padding: 10px; background: #e6f2ff; border-left: 5px solid #0066cc;">
                <strong>💡 最短経路:</strong> <span style="font-size: 1.1em; color: #ff4b4b;">{{ path_text }}</span>
            </div>
        {% endif %}
    </div>

    <div class="graph-container">
        {% if graph_html %}
            {{ graph_html | safe }}
        {% else %}
            <p style="padding: 20px; color: #666;">ここに3Dマップが表示されます。</p>
        {% endif %}
    </div>

</body>
</html>
