<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>一人称ビューア — SenARMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07111d;
      --surface:   #0c1b2d;
      --border:    #1e3450;
      --border-hi: #2e4e78;
      --text:      #d4e8f8;
      --muted:     #4a6e8e;
      --accent:    #00c0ee;
      --accent-dim:rgba(0,192,238,0.12);
      --font:      'Outfit', 'Noto Sans JP', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
    }
    canvas { display: block; }

    /* ============================================================
       BLOCKER OVERLAY
    ============================================================ */
    #blocker {
      position: fixed; inset: 0;
      background: rgba(7, 17, 29, 0.90);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 30; cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Grid background pattern */
    #blocker::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,192,238,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,192,238,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .blocker-card {
      position: relative;
      background: rgba(12, 27, 45, 0.92);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      padding: 36px 40px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,192,238,0.08);
    }
    .blocker-card::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
      border-radius: 1px;
    }

    .blocker-icon {
      font-size: 2.4rem;
      margin-bottom: 14px;
      display: block;
      filter: drop-shadow(0 0 12px rgba(0,192,238,0.4));
    }

    #blocker h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .blocker-subtitle {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    .blocker-keys {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
      text-align: left;
    }
    .blocker-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #6a9abf;
    }
    .blocker-key-row .keys { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

    .key {
      display: inline-flex;
      align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text);
      min-width: 28px;
      height: 24px;
    }

    .blocker-cta {
      display: flex;
      align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #00c0ee, #0098c8);
      color: #07111d;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      padding: 12px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,192,238,0.35);
      animation: pulse-cta 2.5s ease-in-out infinite;
    }

    @keyframes pulse-cta {
      0%, 100% { box-shadow: 0 4px 20px rgba(0,192,238,0.35); }
      50%       { box-shadow: 0 4px 32px rgba(0,192,238,0.60); }
    }

    /* ============================================================
       CROSSHAIR
    ============================================================ */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5; display: none;
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.7);
    }
    #crosshair::before { width: 1px; height: 14px; left: 9px; top: 3px; }
    #crosshair::after  { width: 14px; height: 1px; top: 9px; left: 3px; }

    /* Corner marks */
    #crosshair-corner {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5; display: none;
      width: 24px; height: 24px;
    }
    #crosshair-corner::before {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid rgba(0,192,238,0.4);
      border-radius: 2px;
    }

    /* ============================================================
       HUD BAR
    ============================================================ */
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(7, 17, 29, 0.88);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 5;
      backdrop-filter: blur(10px);
    }
    .hud-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.66rem;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .hud-item .key {
      font-size: 0.60rem;
      min-width: 22px;
      height: 20px;
      padding: 1px 5px;
    }

    /* ============================================================
       NODE INFO
    ============================================================ */
    #node-info {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(12, 27, 45, 0.92);
      border: 1px solid rgba(0,192,238,0.4);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-family: var(--font-mono);
      color: var(--accent);
      z-index: 5; display: none; pointer-events: none;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,192,238,0.15);
    }

    /* ============================================================
       FLOOR BUTTONS
    ============================================================ */
    #floor-btns {
      position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .floor-btn {
      background: rgba(12, 27, 45, 0.88);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.76rem;
      font-family: var(--font-mono);
      font-weight: 500;
      text-align: center;
      transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      min-width: 40px;
    }
    .floor-btn:hover {
      border-color: var(--border-hi);
      color: var(--text);
    }
    .floor-btn.active {
      color: var(--accent);
      border-color: rgba(0,192,238,0.6);
      background: rgba(0,192,238,0.1);
      box-shadow: 0 0 10px rgba(0,192,238,0.2);
    }

    /* ============================================================
       BACK BUTTON
    ============================================================ */
    #back {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(12, 27, 45, 0.88);
      border: 1px solid var(--border-hi);
      color: var(--text-sub, #7aaacb);
      padding: 8px 14px;
      border-radius: 9px;
      text-decoration: none;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 6px;
    }
    #back:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0,192,238,0.2);
    }

    /* ============================================================
       MOBILE MOVE CONTROLS
    ============================================================ */
    #mobile-move {
      position: fixed; left: 14px; bottom: 70px;
      display: none; flex-direction: column; align-items: center;
      gap: 4px; z-index: 10;
    }
    #mobile-move .row { display: flex; gap: 4px; }

    .mv-btn {
      width: 52px; height: 52px;
      background: rgba(12, 27, 45, 0.88);
      border: 1px solid var(--border-hi);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.1s, border-color 0.1s;
      backdrop-filter: blur(8px);
    }
    .mv-btn:active {
      background: var(--accent-dim);
      border-color: rgba(0,192,238,0.5);
    }

    @media (max-width: 767px) {
      #blocker { display: none; }
      #mobile-move { display: flex; }
      #hud { font-size: 0.62rem; padding-bottom: max(70px, env(safe-area-inset-bottom, 70px)); }
    }
  </style>
</head>
<body>

<a href="/3d/" id="back">← マップへ戻る</a>

<div id="blocker">
  <div class="blocker-card">
    <span class="blocker-icon">🧭</span>
    <h2>一人称ビューア</h2>
    <p class="blocker-subtitle">FIRST PERSON VIEW · SENARMAP</p>

    <div class="blocker-keys">
      <div class="blocker-key-row">
        <div class="keys">
          <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
        </div>
        <span>移動</span>
      </div>
      <div class="blocker-key-row">
        <div class="keys"><span style="font-size:0.72rem;color:var(--muted);">マウス</span></div>
        <span>視点操作</span>
      </div>
      <div class="blocker-key-row">
        <div class="keys"><span class="key">H</span><span class="key">B</span></div>
        <span>上の階 / 下の階</span>
      </div>
      <div class="blocker-key-row">
        <div class="keys"><span class="key">M</span></div>
        <span>マップへ戻る</span>
      </div>
      <div class="blocker-key-row">
        <div class="keys"><span class="key">ESC</span></div>
        <span>カーソル解放</span>
      </div>
    </div>

    <div class="blocker-cta">クリックして開始 ▶</div>
  </div>
</div>

<div id="crosshair"></div>
<div id="crosshair-corner"></div>

<div id="hud">
  <div class="hud-item"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span>移動</span></div>
  <div class="hud-item"><span class="key">H</span><span>上階</span></div>
  <div class="hud-item"><span class="key">B</span><span>下階</span></div>
  <div class="hud-item"><span class="key">M</span><span>マップへ</span></div>
</div>

<div id="node-info"></div>
<div id="floor-btns"></div>

<div id="mobile-move">
  <div class="row"><button class="mv-btn" id="mv-fwd">↑</button></div>
  <div class="row">
    <button class="mv-btn" id="mv-left">←</button>
    <button class="mv-btn" id="mv-back">↓</button>
    <button class="mv-btn" id="mv-right">→</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ================================================================
//  座標系の定義
//
//  CSV 空間:   x(東西),  y(南北),  z(階高 m)
//  Three.js:   x(右=東), y(上=高), z(手前=南)
//
//  変換: CSV(x,y,z) → Three(x, z, y)
//    ・CSV x  → Three x  (そのまま)
//    ・CSV y  → Three z  (南北をz奥行きに)
//    ・CSV z  → Three y  (階高を高さに)
//
//  Plotlyの Y反転(autorange:reversed)は「CSV y を南北逆に表示」する。
//  Three.jsでは「z軸が手前＝南方向」なので +y → +z でそのまま一致。
// ================================================================
const Z_SCALE = 3.0;  // 高さ方向の倍率（建物を厚く見せる）
const c2t = (cx, cy, cz) => new THREE.Vector3(cx, cz * Z_SCALE, cy);

// ================================================================
//  定数
// ================================================================
const FLOOR_COLORS = [0xFF8C42,0x06D6A0,0x118AB2,0xFFD166,0xEF476F,0x9B5DE5,0x00BBF9,0xF15BB5];
const floorColor   = f => FLOOR_COLORS[(Math.max(f,1)-1) % FLOOR_COLORS.length];
const EDGE_TYPE_COLORS = { "2": 0xFFB347, "3": 0x00CED1, "4": 0xDA70D6, "5": 0x00FF88, "6": 0xFF4500 };
const EYE_H   = 1.7;   // 目線の高さ (m)
const CEIL_H  = 3.2;   // 床からの天井高 (m)
const SPEED   = 9.0;   // 移動速度
const T_RAD   = 0.28;  // 通路チューブ半径 (m)

// ================================================================
//  Renderer / Scene / Camera
// ================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07111d);
scene.fog = new THREE.FogExp2(0x07111d, 0.014);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(20, 40, 20);
scene.add(sun);

// ================================================================
//  PointerLock (デスクトップ)
// ================================================================
const controls = new PointerLockControls(camera, renderer.domElement);
const blocker   = document.getElementById("blocker");
const crosshair = document.getElementById("crosshair");
const crosshairCorner = document.getElementById("crosshair-corner");

blocker.addEventListener("click", () => controls.lock());
controls.addEventListener("lock",   () => {
  blocker.style.display = "none";
  crosshair.style.display = "block";
  crosshairCorner.style.display = "block";
});
controls.addEventListener("unlock", () => {
  blocker.style.display = "flex";
  crosshair.style.display = "none";
  crosshairCorner.style.display = "none";
});

// ================================================================
//  キーボード
// ================================================================
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyH") jumpFloor(+1);          // 上の階へ
  if (e.code === "KeyB") jumpFloor(-1);           // 下の階へ
  if (e.code === "KeyM") location.href = "/3d/";  // マップへ戻る
});
addEventListener("keyup", e => { keys[e.code] = false; });

["mv-fwd","mv-back","mv-left","mv-right"].forEach(id => {
  const code = { "mv-fwd":"KeyW","mv-back":"KeyS","mv-left":"KeyA","mv-right":"KeyD" }[id];
  const el   = document.getElementById(id);
  el.addEventListener("touchstart", e => { keys[code]=true;  e.preventDefault(); }, { passive:false });
  el.addEventListener("touchend",   e => { keys[code]=false; e.preventDefault(); }, { passive:false });
  el.addEventListener("mousedown",  () => keys[code]=true);
  el.addEventListener("mouseup",    () => keys[code]=false);
});

// ================================================================
//  モバイル: タッチで視点操作 / タップでテレポート
// ================================================================
const euler  = new THREE.Euler(0, 0, 0, "YXZ");
let touch0   = null;
let tapStart = null;
const nodeMeshes = [];

renderer.domElement.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  const t = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
  touch0   = t;
  tapStart = t;
}, { passive: true });

renderer.domElement.addEventListener("touchmove", e => {
  if (!touch0 || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touch0.x;
  const dy = e.touches[0].clientY - touch0.y;
  touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  euler.setFromQuaternion(camera.quaternion);
  euler.y -= dx * 0.0028;
  euler.x  = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, euler.x - dy * 0.0028));
  camera.quaternion.setFromEuler(euler);
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener("touchend", e => {
  if (tapStart) {
    const dx = e.changedTouches[0].clientX - tapStart.x;
    const dy = e.changedTouches[0].clientY - tapStart.y;
    const dt = Date.now() - tapStart.time;
    if (Math.hypot(dx, dy) < 10 && dt < 300) {
      const tx =  (e.changedTouches[0].clientX / innerWidth)  * 2 - 1;
      const ty = -(e.changedTouches[0].clientY / innerHeight) * 2 + 1;
      const rc = new THREE.Raycaster();
      rc.setFromCamera(new THREE.Vector2(tx, ty), camera);
      const hits = rc.intersectObjects(nodeMeshes);
      if (hits.length > 0) {
        const p = hits[0].object.position.clone();
        camera.position.set(p.x, p.y + EYE_H, p.z);
      }
    }
  }
  touch0 = tapStart = null;
}, { passive: true });

// ================================================================
//  データ読み込み
// ================================================================
const { nodes, edges } = await fetch("/api/graph").then(r => r.json());

// ---- 建物全体の Three.js 空間範囲を計算 ----
const allTX = nodes.map(n => n.x);   // Three.x = CSV.x
const allTZ = nodes.map(n => n.y);   // Three.z = CSV.y
const tx0 = Math.min(...allTX) - 4,  tx1 = Math.max(...allTX) + 4;
const tz0 = Math.min(...allTZ) - 4,  tz1 = Math.max(...allTZ) + 4;
const tW  = tx1 - tx0, tD = tz1 - tz0;
const tcx = (tx0 + tx1) / 2;        // Three.js 中心 x
const tcz = (tz0 + tz1) / 2;        // Three.js 中心 z

// ---- フロアごとの Three.js y (高さ) を計算 ----
const floorYSum = {}, floorCount = {};
nodes.forEach(n => {
  floorYSum[n.floor]   = (floorYSum[n.floor]   || 0) + n.z * Z_SCALE;
  floorCount[n.floor]  = (floorCount[n.floor]  || 0) + 1;
});
const floorY   = {};   // floor番号 → Three.js y 座標
Object.keys(floorYSum).forEach(f => { floorY[f] = floorYSum[f] / floorCount[f]; });
const floorList = Object.keys(floorY).map(Number).sort();

// ================================================================
//  シーン構築 — フロアごとに Group にまとめる
// ================================================================

const floorGroups = {};
floorList.forEach(f => {
  floorGroups[f] = new THREE.Group();
  scene.add(floorGroups[f]);
});

// ---- 床・天井・グリッド・枠 ----
floorList.forEach(f => {
  const g   = floorGroups[f];
  const ty  = floorY[f];
  const col = floorColor(f);

  const grid = new THREE.GridHelper(Math.max(tW, tD) + 8, 40, 0x0d1f33, 0x0d1f33);
  grid.position.set(tcx, ty + 0.005, tcz);
  g.add(grid);

  const frame = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(tx0, ty + 0.02, tz0),
      new THREE.Vector3(tx1, ty + 0.02, tz0),
      new THREE.Vector3(tx1, ty + 0.02, tz1),
      new THREE.Vector3(tx0, ty + 0.02, tz1),
    ]),
    new THREE.LineBasicMaterial({ color: col, opacity: 0.4, transparent: true })
  );
  g.add(frame);
});

// ---- 通路チューブ (type別色: 1=フロア色, 2=階段/#FFB347, 3=エスカレーター/#00CED1, 4=EV/#DA70D6, 5=上りESC/#00FF88, 6=下りESC/#FF4500) ----
edges.forEach(e => {
  const color = EDGE_TYPE_COLORS[String(e.type)] ?? floorColor(e.floor);
  const p0 = c2t(e.x0, e.y0, e.z0); p0.y += 0.04;
  const p1 = c2t(e.x1, e.y1, e.z1); p1.y += 0.04;
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.LineCurve3(p0, p1), 1, T_RAD, 6, false),
    new THREE.MeshLambertMaterial({ color })
  );
  floorGroups[e.floor].add(tube);

  // 一方向エスカレータ(type 5/6)は矢印で方向を示す
  if (e.type === "5" || e.type === "6") {
    const dir = new THREE.Vector3().subVectors(p1, p0);
    const len = dir.length();
    if (len > 0.01) {
      dir.normalize();
      const arrow = new THREE.ArrowHelper(dir, p0.clone().lerp(p1, 0.5), len * 0.4, color, len * 0.3, 0.3);
      floorGroups[e.floor].add(arrow);
    }
  }
});

// ---- ノードマーカー ----
nodes.forEach(n => {
  const col     = floorColor(n.floor);
  const pos     = c2t(n.x, n.y, n.z);
  const isEntry = n.type === 2;

  const geo = isEntry
    ? new THREE.CylinderGeometry(0.22, 0.22, 1.8, 8)
    : new THREE.SphereGeometry(0.20, 10, 10);
  const mat = new THREE.MeshLambertMaterial({
    color: col,
    emissive: new THREE.Color(col),
    emissiveIntensity: isEntry ? 0.6 : 0.3,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pos.x, pos.y + (isEntry ? 0.9 : 0.20), pos.z);
  mesh.userData = n;
  floorGroups[n.floor].add(mesh);
  nodeMeshes.push(mesh);
});

// ---- カレントフロアをインデックスで管理 ----
let currentFloorIdx = Math.max(floorList.indexOf(1), 0);

function goToFloorIdx(idx) {
  if (idx < 0 || idx >= floorList.length) return;
  currentFloorIdx = idx;
  const f = floorList[currentFloorIdx];
  floorList.forEach(fl => {
    floorGroups[fl].visible = Math.abs(fl - f) <= 1;
  });
  document.querySelectorAll(".floor-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === `${f}F`);
  });
}

function updateFloorVisibility() { /* goToFloorIdx で管理 */ }

// ---- カメラ初期位置: CSV原点(0,0,0) ----
camera.position.set(0, EYE_H, 0);
camera.lookAt(new THREE.Vector3(tcx, EYE_H, tcz));
goToFloorIdx(currentFloorIdx);

// ---- フロアジャンプボタン ----
const floorBtns = document.getElementById("floor-btns");
[...floorList].reverse().forEach(f => {
  const colHex = "#" + floorColor(f).toString(16).padStart(6, "0");
  const btn = document.createElement("button");
  btn.className   = "floor-btn" + (f === 1 ? " active" : "");
  btn.textContent = `${f}F`;
  btn.style.borderColor = colHex;
  btn.addEventListener("click", () => {
    camera.position.y = floorY[f] + EYE_H;
    goToFloorIdx(floorList.indexOf(f));
  });
  floorBtns.appendChild(btn);
});

// ================================================================
//  ノードホバー表示 (デスクトップ)
// ================================================================
const raycaster = new THREE.Raycaster();
const center2d  = new THREE.Vector2(0, 0);
const nodeInfo  = document.getElementById("node-info");

// ================================================================
//  フロアジャンプ (H=上 / B=下)
// ================================================================
function jumpFloor(dir) {
  const nextIdx = currentFloorIdx + dir;
  if (nextIdx < 0 || nextIdx >= floorList.length) return;
  camera.position.y = floorY[floorList[nextIdx]] + EYE_H;
  goToFloorIdx(nextIdx);
}

// ================================================================
//  アニメーションループ
// ================================================================
const vel  = new THREE.Vector3();
let prevT  = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - prevT) / 1000, 0.05);
  prevT     = now;

  const locked = controls.isLocked;
  const mobile = innerWidth <= 767;

  if (locked || mobile) {
    vel.x *= Math.pow(0.0001, dt);
    vel.z *= Math.pow(0.0001, dt);

    const fwd = ((keys["KeyW"]||keys["ArrowUp"])    ? 1:0) - ((keys["KeyS"]||keys["ArrowDown"])  ? 1:0);
    const rgt = ((keys["KeyD"]||keys["ArrowRight"]) ? 1:0) - ((keys["KeyA"]||keys["ArrowLeft"])  ? 1:0);
    vel.z -= fwd * SPEED * dt * 60;
    vel.x -= rgt * SPEED * dt * 60;

    controls.moveForward(-vel.z * dt);
    controls.moveRight(-vel.x * dt);

    if (locked) {
      raycaster.setFromCamera(center2d, camera);
      const hits = raycaster.intersectObjects(nodeMeshes);
      if (hits.length > 0) {
        const n = hits[0].object.userData;
        nodeInfo.textContent   = `Node ${n.id} ／ B${n.building} ／ ${n.floor}F`;
        nodeInfo.style.display = "block";
      } else {
        nodeInfo.style.display = "none";
      }
    }
  } else {
    prevT = performance.now();
  }

  updateFloorVisibility();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
