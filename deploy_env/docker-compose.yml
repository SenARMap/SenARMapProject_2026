networks:
  app_net:
    driver: overlay   # Swarm のオーバーレイネットワーク（ノード間通信）
    attachable: true  # デバッグ時に docker run でアタッチ可能にする

configs:
  prometheus_config:
    file: ./prometheus/prometheus.yml

services:
  python:
    image: ghcr.io/senarmaporg/iki_project_2026_python:latest
    # workers: 複数レプリカ構成なので 1コンテナあたり 4 に削減
    # (イベント時: 4レプリカ × 4workers = 16並列、平常時: 2 × 4 = 8並列)
    command: gunicorn -w 4 -b 0.0.0.0:8000 app:app
    networks:
      - app_net
    deploy:
      replicas: 2           # 平常時: manager/worker に1つずつ
      placement:
        preferences:
          - spread: node.id # ノードに均等分散
      update_config:
        parallelism: 1      # ローリングアップデート: 1台ずつ
        delay: 10s
        order: start-first  # 新コンテナを先に起動してからold削除 → ゼロダウンタイム
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: ghcr.io/senarmaporg/iki_project_2026_nginx:latest
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    networks:
      - app_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # cloudflared と同居させるためマネージャー固定
      restart_policy:
        condition: on-failure

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql  # ボリュームがマネージャーにあるため固定
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  counter:
    image: ghcr.io/senarmaporg/iki_project_2026_counter:latest
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app_net
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        # Swarm は depends_on を無視するため delay で DB 起動を待つ
        delay: 15s
        max_attempts: 5

  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
      # Swarm サービスディスカバリのために docker.sock をマウント
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - app_net
    deploy:
      mode: global          # 全ノードで1つずつ起動（ノード追加時に自動展開）
      restart_policy:
        condition: on-failure

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # トンネルの入口はマネージャー1台
      restart_policy:
        condition: on-failure

volumes:
  db_data:
  grafana_data:
  prometheus_data:
