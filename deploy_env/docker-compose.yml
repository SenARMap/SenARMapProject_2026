services:
  python:
    image: iki_project_2026_python
    build: ./python/
    container_name: 'iki_project_2026_python'
    volumes:
      - ../:/project/
    command: gunicorn -w 10 -b 0.0.0.0:8000 app:app
  nginx:
    image: iki_project_2026_nginx
    build: ./nginx/
    container_name: 'iki_project_2026_nginx'
    ports:
      - 8080:80
      - 4430:443
    volumes:
      - ./nginx/ssl/:/etc/nginx/certs/
      - ../:/project/
    depends_on:
      - counter
  db:
    image: mariadb:11
    container_name: 'iki_project_2026_mariadb'
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  counter:
    build:
      context: ./Counters
    container_name: 'iki_project_2026_counter'
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  db_data:
    