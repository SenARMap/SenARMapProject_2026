apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-updater
  namespace: iki-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-updater
  namespace: iki-project
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-updater
  namespace: iki-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-updater
subjects:
  - kind: ServiceAccount
    name: auto-updater
    namespace: iki-project
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-update
  namespace: iki-project
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: auto-updater
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:1.31
              command:
                - kubectl
                - rollout
                - restart
                - deployment/python
                - deployment/nginx
                - -n
                - iki-project
