<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - リクエストが正しくありません</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            min-height: 100vh;
            background: #f7f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 3.5rem 3rem;
            max-width: 480px;
            width: calc(100% - 3rem);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .code {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .accent {
            display: block;
            width: 48px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            margin: 1.25rem auto 0;
        }
        .title {
            margin-top: 1.25rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a202c;
        }
        .desc {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #718096;
            line-height: 1.9;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.7rem 2.25rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 100px;
            letter-spacing: 0.05em;
            transition: opacity 0.15s ease, transform 0.15s ease;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
        }
        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem; border-radius: 16px; }
            .code { font-size: 4.5rem; letter-spacing: -2px; }
            .title { font-size: 1.1rem; }
            .desc { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">400</div>
        <span class="accent"></span>
        <div class="title">リクエストが正しくありません</div>
        <div class="desc">
            サーバーがリクエストの内容を解釈できませんでした。<br>
            入力内容をご確認の上、再度お試しください。
        </div>
        <a class="btn" href="/">ホームに戻る</a>
    </div>
</body>
</html>
